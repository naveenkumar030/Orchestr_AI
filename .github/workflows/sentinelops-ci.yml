name: SentinelOps Autonomous CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Deliberately induce a test failure to trigger SentinelOps Healer-Alpha auto-remediation'
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gates:
    name: Python Backend Tests, Linting & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff pip-audit

      - name: Backend Code Quality & Linting
        run: |
          ruff check backend/ --ignore E501,F401,F841 || true

      - name: Python Dependency Security Audit
        run: |
          pip-audit -r backend/requirements.txt || true

      - name: Run Backend Integration & Safeguard Test Suites
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/test_api.py backend/tests/ -v -o pythonpath=backend

      - name: Simulated CI Failure (Healer-Alpha Auto-Remediation Trigger)
        if: ${{ inputs.simulate_failure == true }}
        run: |
          echo "================================================================="
          echo "::error::Deliberate simulated failure injected via workflow_dispatch!"
          echo "================================================================="
          echo "Traceback (most recent call last):"
          echo "  File \"services/auth/token_validator.py\", line 48, in verify"
          echo "AssertionError: assert True is False"
          echo "E   AssertionError: TokenValidator incorrectly accepted expired token"
          exit 1

  frontend-quality-gates:
    name: Frontend Static Analysis, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cicd-app/package.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix cicd-app ci

      - name: Frontend Static Analysis & Lint
        run: |
          npm --prefix cicd-app run lint

      - name: Frontend Typecheck & Production Build
        run: |
          npm --prefix cicd-app run build
