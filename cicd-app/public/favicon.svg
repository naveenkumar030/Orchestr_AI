<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88A6D"/>
      <stop offset="100%" stop-color="#D97757"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D97757" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="48" height="48" rx="11" fill="#1C1917"/>
  <rect x="1" y="1" width="46" height="46" rx="10" fill="none" stroke="#D97757" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Autonomous DevOps Loop / Auto Mode Icon -->
  <g transform="translate(24, 24)" filter="url(#glow)">
    <!-- Central AI node -->
    <circle cx="0" cy="0" r="3.5" fill="url(#brandGrad)"/>

    <!-- Clockwise orbiting continuous cycle (Autonomous CI/CD) -->
    <!-- Top-right arc with arrow head -->
    <path d="M 0 -13 A 13 13 0 0 1 13 0" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="13, -1 16.5, 4 9.5, 4" fill="#E88A6D" transform="rotate(45, 13, 0)"/>

    <!-- Bottom-left arc with arrow head -->
    <path d="M 0 13 A 13 13 0 0 1 -13 0" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-13, 1 -9.5, -4 -16.5, -4" fill="#E88A6D" transform="rotate(45, -13, 0)"/>
  </g>
</svg>